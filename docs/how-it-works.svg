    <path d="M34 232q10-8 20 0t20 0t20 0M70 254q10-8 20 0t20 0M150 296q10-8 20 0t20 0t20 0M336 300q10-8 20 0t20 0"/>
    <path d="M196 246q12-9 24 0t24 0t24 0t24 0t24 0t24 0t24 0M214 262q12-9 24 0t24 0t24 0t24 0t24 0"/>
  </g>
  <path d="M436 236c-16-66 34-118 124-124 80-16 140 38 200 28 80-22 170 10 170 80 4 70-70 92-150 86-80 12-160 6-220-6-70-4-114-20-124-64z" fill="#f3e6c4" stroke="#cdb681" stroke-width="2"/>
  <path d="M742 150l13-20 13 20M764 150l10-15 10 15" fill="none" stroke="#b9a06a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="86" cy="340" r="25" fill="none" stroke="#d3bd8c" stroke-width="2"/>
  <path d="M86 312l6 22 22 6-22 6-6 22-6-22-22-6 22-6z" fill="#d9a441"/>
  <circle cx="86" cy="340" r="3" fill="#fbf3df"/>

