<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · PiRick</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/static/icon.svg" width="56" height="56" alt="">
    <h1>PiRick</h1>
    <p class="muted">Sign in to ask for something to watch.</p>
    <form id="login-form" method="post" novalidate>
      <label>Username
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
      </label>
      <p id="login-error" class="form-note bad" role="alert" hidden></p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
