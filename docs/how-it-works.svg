    <path d="M8 40C10 14 28 4 52 4s42 10 44 36z" fill="#5b3a22" stroke="#3d2616" stroke-width="2"/>
    <path d="M22 38C24 22 36 14 52 14s28 8 30 24" fill="none" stroke="#7a5230" stroke-width="3"/>
