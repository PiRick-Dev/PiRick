  <main class="login-card">
    <img src="/static/icon.svg" width="56" height="56" alt="">
    <h1>PiRick</h1>
    <p class="muted">Sign in to ask for something to watch.</p>
    <form id="login-form" method="post" novalidate>
      <label>Username
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
      </label>
      <p id="login-error" class="form-note bad" role="alert" hidden></p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>
