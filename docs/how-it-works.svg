<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How PiRick works, drawn as a treasure hunt</title>
  <desc id="desc">You ask in plain words. Ollama is the captain of the ship PiRick and decides what to do. Jackett is the tavern where the map is found: it searches for a copy. qBittorrent is the crew that digs: it downloads it. The Plex library is the treasure chest where your shows end up.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#6b5a45"/>
    </marker>
    <path id="fronds" d="M0 0c-14-10-30-8-40 2 14-4 28-4 40-2zM0 0c-8-16-24-22-38-18 14 2 28 8 38 18zM0 0c2-16 14-26 28-26-10 6-20 14-28 26zM0 0c12-12 30-12 42-2-14-4-28-2-42 2zM0 0c10 0 24 8 28 22-8-10-18-18-28-22zM0 0c-10 2-20 12-22 26 6-12 14-20 22-26z"/>
    <path id="sparkle" d="M0-7l1.8 5.2L7 0 1.8 1.8 0 7l-1.8-5.2L-7 0l5.2-1.8z"/>
  </defs>

  <!-- The chart: sea on the left, the island on the right -->
