# Tests every push and builds the Docker image. A merge into main publishes it,
# so main only changes through a pull request from dev.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Nothing here may write to the repository. The image job asks for the one extra right it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces an older run, except on main, where a release build is never cut short.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    # A pull request builds the image to prove it still can be built. Only main publishes it.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # arm64 is built by emulation, for Raspberry Pi and ARM-based NAS boxes.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # "latest" is what people run. The commit tag lets them pin a build or go back to one.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=PiRick
            org.opencontainers.image.description=Chat with an LLM to find media with Jackett and download it with qBittorrent.
            org.opencontainers.image.licenses=MIT
      - id: built
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Kept in the image, so Admin > Connections can say which build is running.
          build-args: |
            PIRICK_COMMIT=${{ github.sha }}
            PIRICK_BUILT=${{ steps.built.outputs.at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
