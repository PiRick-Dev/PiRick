    <path d="M104 164c0 42 46 50 100 42"/>
    <path d="M382 224c16 24 38 32 62 30"/>
    <path d="M592 262c8 20 22 26 38 26"/>
    <path d="M768 292c20 0 30-12 34-28"/>
  </g>

  <!-- You -->
