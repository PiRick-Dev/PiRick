    <g transform="translate(14 88) rotate(-8)">
      <rect x="-23" y="-16" width="46" height="32" rx="2" fill="#f7edd3" stroke="#7a5230" stroke-width="2"/>
      <path d="M-23-16v32M23-16v32" fill="none" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
      <path d="M-15 7q7-15 15-5t11-7" fill="none" stroke="#6b5a45" stroke-width="1.7" stroke-dasharray="3 3" stroke-linecap="round"/>
